<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Suggestions & Profil - Atelier Papote</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #0284c7; text-decoration: none; font-weight: bold; }
        
        /* SECTIONS DE LA PAGE */
        .card { background: #f1f5f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border-left: 5px solid #0284c7; }
        .profile-box { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #0284c7; }
        
        .form-group { margin-top: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        .btn-submit { background-color: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #15803d; }
        .btn-blue { background-color: #0284c7; }
        .btn-blue:hover { background-color: #0369a1; }

        /* LISTE DES PROPOSITIONS */
        .proposal-item { background: white; padding: 15px; border-radius: 8px; margin-top: 12px; border: 1px solid #cbd5e1; }
        .proposal-meta { font-size: 12px; color: #64748b; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .admin-reply { background: #e0f2fe; border-left: 4px solid #0284c7; padding: 10px; margin-top: 10px; border-radius: 4px; }

        #not-connected-msg { text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-back">← Retour au calendrier</a>

        <div id="not-connected-msg" style="display: none;">
            <h2>🔒 Accès Réservé</h2>
            <p>Vous devez être connecté(e) pour accéder à votre profil et faire des propositions d'ateliers.</p>
            <a href="index.html" class="btn-submit btn-blue" style="text-decoration:none; display:inline-block; margin-top:10px;">Se connecter sur la page d'accueil</a>
        </div>

        <div id="user-content" style="display: none;">
            
            <div class="card">
                <h2>👤 Mon Profil</h2>
                <div class="profile-box">
                    <img id="my-avatar-img" src="" alt="Mon Avatar" class="profile-avatar">
                    <div style="flex: 1; min-width: 250px;">
                        <p style="margin: 0 0 10px 0;">Bienvenue, <strong id="my-username-txt">...</strong> !</p>
                        
                        <form id="change-avatar-form">
                            <div class="form-group">
                                <label for="new-avatar-url">Changer mon image d'avatar (Lien URL) :</label>
                                <input type="url" id="new-avatar-url" placeholder="https://exemple.com/mon-image.jpg" required>
                            </div>
                            <button type="submit" class="btn-submit btn-blue">🖼️ Mettre à jour mon avatar</button>
                        </form>
                        <div id="avatar-msg" style="margin-top: 8px; font-weight: bold;"></div>
                    </div>
                </div>
            </div>

            <div class="card" style="border-left-color: #16a34a;">
                <h2>💡 Proposer une idée ou poser une question</h2>
                <form id="add-proposal-form">
                    <div class="form-group">
                        <label for="workshop-select">Concerne l'atelier du :</label>
                        <select id="workshop-select" required>
                            <option value="3 Août - Film Coraline">3 Août - Film, Débat & Just Dance</option>
                            <option value="Proposition Générale">Proposition générale pour un futur atelier</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="proposal-text">Votre idée ou message :</label>
                        <textarea id="proposal-text" rows="4" placeholder="Ex: Proposer un jeu de société, apporter un plat spécifique, poser une question..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">📩 Envoyer ma proposition</button>
                </form>
                <div id="proposal-msg" style="margin-top: 8px; font-weight: bold;"></div>
            </div>

            <div>
                <h2>📋 Propositions envoyées & Réponses</h2>
                <div id="proposals-list">
                    </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userSession = JSON.parse(localStorage.getItem('user_session'));

            const notConnectedDiv = document.getElementById('not-connected-msg');
            const userContentDiv = document.getElementById('user-content');

            // 1. VERIFICATION DE LA CONNEXION
            if (!userSession) {
                notConnectedDiv.style.display = 'block';
                return;
            }

            userContentDiv.style.display = 'block';

            // Affichage des données profil
            const avatarImg = document.getElementById('my-avatar-img');
            const usernameTxt = document.getElementById('my-username-txt');
            const newAvatarInput = document.getElementById('new-avatar-url');

            avatarImg.src = userSession.avatar;
            usernameTxt.textContent = userSession.username;
            newAvatarInput.value = userSession.avatar;

            // 2. CHANGER SON AVATAR
            document.getElementById('change-avatar-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newUrl = newAvatarInput.value.trim();

                if (newUrl) {
                    // Mise à jour de la session actuelle
                    userSession.avatar = newUrl;
                    localStorage.setItem('user_session', JSON.stringify(userSession));

                    // Mise à jour dans la liste globale des utilisateurs
                    let users = JSON.parse(localStorage.getItem('registered_users')) || [];
                    users = users.map(u => {
                        if (u.username.toLowerCase() === userSession.username.toLowerCase()) {
                            u.avatar = newUrl;
                        }
                        return u;
                    });
                    localStorage.setItem('registered_users', JSON.stringify(users));

                    // Mettre à jour l'image affichée
                    avatarImg.src = newUrl;

                    const msg = document.getElementById('avatar-msg');
                    msg.style.color = "#16a34a";
                    msg.textContent = "✅ Avatar mis à jour avec succès !";
                    setTimeout(() => msg.textContent = "", 3000);
                }
            });

            // 3. CHARGER LES PROPOSITIONS
            function loadProposals() {
                const listContainer = document.getElementById('proposals-list');
                const proposals = JSON.parse(localStorage.getItem('workshop_proposals')) || [];

                if (proposals.length === 0) {
                    listContainer.innerHTML = "<p style='color:#64748b;'>Aucune proposition envoyée pour le moment.</p>";
                    return;
                }

                listContainer.innerHTML = proposals.map(p => `
                    <div class="proposal-item">
                        <div class="proposal-meta">
                            <span><strong>${p.workshopName}</strong> par ${p.userName}</span>
                            <span>🕒 ${p.submittedAt}</span>
                        </div>
                        <p style="margin: 5px 0; font-size:15px;">${p.message}</p>
                        
                        ${p.reply ? `
                            <div class="admin-reply">
                                <strong>🛠️ Réponse de l'Admin :</strong>
                                <p style="margin: 4px 0 0 0; font-size: 14px;">${p.reply}</p>
                            </div>
                        ` : `
                            <small style="color: #d97706; font-weight: bold;">⌛ En attente de réponse de l'administrateur</small>
                        `}
                    </div>
                `).join('');
            }

            // 4. SOUMETTRE UNE NOUVELLE PROPOSITION
            document.getElementById('add-proposal-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const workshopName = document.getElementById('workshop-select').value;
                const messageText = document.getElementById('proposal-text').value.trim();

                if (!messageText) return;

                const newProposal = {
                    id: Date.now(),
                    userName: userSession.username,
                    userAvatar: userSession.avatar,
                    workshopName: workshopName,
                    message: messageText,
                    reply: null,
                    submittedAt: new Date().toLocaleString('fr-FR')
                };

                let proposals = JSON.parse(localStorage.getItem('workshop_proposals')) || [];
                proposals.push(newProposal);
                localStorage.setItem('workshop_proposals', JSON.stringify(proposals));

                document.getElementById('proposal-text').value = "";
                
                const msg = document.getElementById('proposal-msg');
                msg.style.color = "#16a34a";
                msg.textContent = "✅ Votre proposition a été transmise à l'administrateur !";
                setTimeout(() => msg.textContent = "", 3000);

                loadProposals();
            });

            loadProposals();
        });
    </script>
</body>
</html>
