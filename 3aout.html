<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Août - Atelier Papote & Coraline</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 20px; padding-bottom: 100px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* BARRE D'AUTHENTIFICATION */
        .auth-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; }
        .btn-auth { background-color: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; }

        .btn-action { display: inline-block; background-color: #16a34a; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-decoration: none; margin-top: 15px; }
        .btn-back { display: inline-block; margin-bottom: 15px; color: #0284c7; text-decoration: none; font-weight: bold; }
        
        /* SECTION RECETTES PDF */
        .pdf-section { margin-top: 30px; background-color: #f1f5f9; padding: 20px; border-radius: 10px; border-left: 5px solid #0284c7; }
        .pdf-card { background: white; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .pdf-viewer { width: 100%; height: 350px; border: 1px solid #cbd5e1; border-radius: 6px; margin-top: 10px; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.2); color: #333; }
        .close-modal { position: absolute; top: 12px; right: 15px; font-size: 24px; cursor: pointer; color: #64748b; }
        .form-group { margin-top: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }

        /* LECTEUR MUSIQUE RÉDUISIBLE FLOTTANT */
        .mini-player-container {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 320px;
            background: #0f172a;
            color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 999;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .mini-player-header {
            background: #0284c7;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-toggle-player {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-toggle-player:hover { background: rgba(255,255,255,0.4); }
        .playlist-iframe { width: 100%; height: 180px; border: none; display: block; }

        /* ÉTAT RÉDUIT */
        .mini-player-container.minimized { width: 220px; }
        .mini-player-container.minimized .playlist-iframe { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="auth-bar">
            <div id="auth-status">
                <span>Non connecté(e)</span>
            </div>
            <div id="auth-actions">
                <button id="btn-open-register" class="btn-auth">Se connecter / S'inscrire</button>
            </div>
        </div>

        <a href="index.html" class="btn-back">← Retour au calendrier</a>

        <h1>🎬 Atelier du 3 Août : Film, Débat, Repas & Just Dance</h1>
        <img src="assets/images/coraline.jpg" alt="Affiche Coraline" style="width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px;" onerror="this.src='https://via.placeholder.com/800x350?text=Atelier+Coraline'">

        <div style="text-align: center; margin: 20px 0;">
            <button id="btn-open-survey" class="btn-action">⭐ Donner mon avis sur cet atelier</button>
        </div>

        <section class="pdf-section">
            <h2>📖 Recettes de l'Atelier (PDF)</h2>
            <div class="pdf-card">
                <h3>🍽️ Recette du 3 Août</h3>
                <iframe class="pdf-viewer" src="assets/pdf/recette-3-aout.pdf"></iframe>
            </div>
        </section>
    </div>

    <div id="mini-player" class="mini-player-container">
        <div class="mini-player-header">
            <span id="player-title">🎵 Coraline OST</span>
            <button id="btn-toggle-player" class="btn-toggle-player">➖ Réduire</button>
        </div>
        <iframe id="coraline-player" class="playlist-iframe" src="https://www.youtube.com/embed/videoseries?list=OLAK5uy_nWlvQ-Z2uTrZ5-HjlAXI0mp3j9uwRiSvQ&enablejsapi=1&autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div id="survey-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="btn-close-survey" class="close-modal">&times;</span>
            <h2>📝 Questionnaire de Satisfaction</h2>
            <p><small>Atelier : <strong>Film, Débat & Just Dance (3 Août)</strong></small></p>

            <form id="survey-form">
                <div class="form-group">
                    <label>Votre Nom / Pseudo :</label>
                    <input type="text" id="survey-name" readonly style="background:#f1f5f9;">
                </div>

                <div class="form-group">
                    <label>Niveau de satisfaction :</label>
                    <select id="survey-satisfaction" required>
                        <option value="">-- Choisissez une note --</option>
                        <option value="😍 Très satisfait">😍 Très satisfait</option>
                        <option value="🙂 Satisfait">🙂 Satisfait</option>
                        <option value="😐 Moyen">😐 Moyen</option>
                        <option value="🙁 Déçu">🙁 Déçu</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Un commentaire ou une idée ?</label>
                    <textarea id="survey-comment" rows="3" placeholder="Votre avis..."></textarea>
                </div>

                <button type="submit" class="btn-action" style="width: 100%; margin-top: 20px;">Envoyer mon avis</button>
            </form>
            <div id="survey-message" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </div>
    </div>

    <div id="register-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            
            <div style="display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:15px;">
                <button id="tab-login" style="flex:1; padding:10px; border:none; background:none; cursor:pointer; font-weight:bold; border-bottom:3px solid #0284c7;">Se connecter</button>
                <button id="tab-register" style="flex:1; padding:10px; border:none; background:none; cursor:pointer; font-weight:bold;">Créer un compte</button>
            </div>

            <div id="form-login">
                <div class="form-group">
                    <label>Pseudo :</label>
                    <input type="text" id="login-username" placeholder="Votre pseudo">
                </div>
                <div class="form-group">
                    <label>Mot de passe :</label>
                    <input type="password" id="login-password" placeholder="Mot de passe">
                </div>
                <button id="btn-submit-login" class="btn-auth" style="width:100%; margin-top:15px; padding:10px;">Connexion</button>
            </div>

            <div id="form-register" style="display:none;">
                <div class="form-group">
                    <label>Pseudo :</label>
                    <input type="text" id="reg-username" placeholder="Ex: Alex">
                </div>
                <div class="form-group">
                    <label>Mot de passe :</label>
                    <input type="password" id="reg-password" placeholder="Mot de passe">
                </div>
                <div class="form-group">
                    <label>Lien photo / avatar (Optionnel) :</label>
                    <input type="text" id="reg-avatar" placeholder="https://...">
                </div>
                <button id="btn-submit-register" class="btn-action" style="width:100%; margin-top:15px; padding:10px;">S'inscrire</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. GESTION MUSIQUE
            const iframePlayer = document.getElementById('coraline-player');
            const playerBox = document.getElementById('mini-player');
            const btnToggle = document.getElementById('btn-toggle-player');
            let hasStarted = false;

            document.addEventListener('click', () => {
                if (!hasStarted && iframePlayer) {
                    iframePlayer.src = iframePlayer.src.replace("mute=1", "mute=0");
                    hasStarted = true;
                }
            });

            if (btnToggle && playerBox) {
                btnToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playerBox.classList.toggle('minimized');
                    btnToggle.textContent = playerBox.classList.contains('minimized') ? "➕ Agrandir" : "➖ Réduire";
                });
            }

            // 2. MODAL QUESTIONNAIRE DE SATISFACTION
            const modalSurvey = document.getElementById('survey-modal');
            const modalAuth = document.getElementById('register-modal');
            const btnOpen = document.getElementById('btn-open-survey');
            const btnClose = document.getElementById('btn-close-survey');
            const inputName = document.getElementById('survey-name');
            const formSurvey = document.getElementById('survey-form');
            const msgSurvey = document.getElementById('survey-message');

            if (btnOpen) {
                btnOpen.addEventListener('click', () => {
                    const session = JSON.parse(localStorage.getItem('user_session'));
                    if (!session) {
                        alert("⚠️ Vous devez être connecté(e) pour donner votre avis !");
                        if (modalAuth) modalAuth.style.display = 'flex';
                        return;
                    }
                    if (inputName) inputName.value = session.username;
                    if (modalSurvey) modalSurvey.style.display = 'flex';
                });
            }

            if (btnClose && modalSurvey) {
                btnClose.addEventListener('click', () => { modalSurvey.style.display = 'none'; });
            }

            // 3. SOUMISSION DU FORMULAIRE (ENREGISTREMENT ADMIN)
            if (formSurvey) {
                formSurvey.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const session = JSON.parse(localStorage.getItem('user_session'));

                    const newResponse = {
                        id: Date.now(),
                        workshopName: "Film, Débat & Just Dance (3 Août)",
                        name: session ? session.username : (inputName ? inputName.value : "Anonyme"),
                        satisfaction: document.getElementById('survey-satisfaction')?.value || "Non renseigné",
                        comment: document.getElementById('survey-comment')?.value || "Aucun commentaire",
                        submittedAt: new Date().toLocaleString('fr-FR')
                    };

                    let submissions = JSON.parse(localStorage.getItem('form_submissions')) || [];
                    submissions.push(newResponse);
                    localStorage.setItem('form_submissions', JSON.stringify(submissions));

                    if (msgSurvey) {
                        msgSurvey.style.color = "#16a34a";
                        msgSurvey.textContent = "✅ Merci ! Votre avis a bien été enregistré.";
                    }

                    setTimeout(() => {
                        if (modalSurvey) modalSurvey.style.display = 'none';
                        formSurvey.reset();
                        if (msgSurvey) msgSurvey.textContent = "";
                    }, 1500);
                });
            }
        });
    </script>
</body>
</html>
