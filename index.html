<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Papote</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-bar { display: flex; justify-content: space-between; align-items: center; background-color: #0f172a; color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .auth-buttons { display: flex; gap: 10px; }
        .btn-auth { background-color: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-auth:hover { background-color: #0369a1; }
        .btn-admin { background-color: #e11d48; }
        .btn-admin:hover { background-color: #be123c; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; color: #333; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 22px; font-weight: bold; color: #666; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab-btn.active { border-bottom: 2px solid #0284c7; color: #0284c7; }

        /* Style du calendrier d'origine */
        .calendar-container { background: #fff; border-radius: 8px; padding: 15px; border: 1px solid #e2e8f0; margin-top: 10px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 10px; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; margin-bottom: 5px; }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-days div { padding: 10px; text-align: center; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; min-height: 40px; }
        .calendar-days div.empty { border: none; cursor: default; }
        .calendar-days div.has-event { background-color: #e0f2fe; border-color: #0284c7; font-weight: bold; }
        .calendar-days div.selected { border: 2px solid #16a34a; background-color: #dcfce7; }
        .calendar-days div.today { border: 2px solid #0284c7; }
        
        /* Aperçu d'événement */
        .event-card { margin-top: 15px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div id="auth-status">
                <span>Bienvenue sur Atelier Papote !</span>
            </div>
            <div class="auth-buttons" id="auth-actions">
                <button id="btn-open-register" class="btn-auth">Créer un compte</button>
                <button id="btn-open-admin-login" class="btn-auth btn-admin">Connexion Admin 🛠️</button>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            
            <div style="display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:15px;">
                <button id="tab-login" class="tab-btn active">Se connecter</button>
                <button id="tab-register" class="tab-btn">Créer un compte</button>
            </div>

            <div id="form-login">
                <label style="display:block; margin-top:10px;">Pseudo :</label>
                <input type="text" id="login-username" placeholder="Votre pseudo" style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px;">Mot de passe :</label>
                <input type="password" id="login-password" placeholder="Votre mot de passe" style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">

                <button id="btn-submit-login" class="btn-auth" style="width:100%; margin-top:15px;">Connexion</button>
            </div>

            <div id="form-register" style="display:none;">
                <label style="display:block; margin-top:10px;">Choisissez un pseudo :</label>
                <input type="text" id="reg-username" placeholder="Ex: Alex" style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px;">Choisissez un mot de passe :</label>
                <input type="password" id="reg-password" placeholder="Mot de passe" style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px;">Lien de votre photo / avatar (Optionnel) :</label>
                <input type="text" id="reg-avatar" placeholder="https://..." style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">

                <button id="btn-submit-register" class="btn-auth" style="width:100%; background:#16a34a; margin-top:15px;">S'inscrire</button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 style="color: #e11d48; margin-top:0;">Connexion Administrateur</h3>
            
            <div class="form-group">
                <label for="admin-pass">Mot de passe Admin :</label>
                <input type="password" id="admin-pass" placeholder="Entrez le mot de passe" style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">
            </div>

            <button id="btn-submit-admin" class="btn-auth btn-admin" style="width: 100%; margin-top: 15px;">Se connecter en Admin</button>
        </div>
    </div>

    <header class="container">
        <div id="banner" style="position: relative; text-align: center;">
            <img id="banner-img" src="assets/images/coraline.jpg" alt="Bannière Atelier Papote" style="width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 8px;">
            <p id="banner-txt" style="margin-top: 10px; font-weight: bold;"></p>
            <div id="dots" style="display: flex; justify-content: center; gap: 8px; margin-top: 10px;"></div>
        </div>
    </header>

    <main class="container">
        <h2>Questionnaire et inscription</h2>

        <form id="workshop-form">
            <div class="form-group">
                <label for="name">Votre surnom :</label>
                <input type="text" id="name" placeholder="Ex: Pommni" required>
            </div>

            <div class="form-group">
                <label>Sélectionnez la date de l'atelier dans le calendrier :</label>
                
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button type="button" id="prev-month">&lt;</button>
                        <span id="calendar-month-year">Août 2026</span>
                        <button type="button" id="next-month">&gt;</button>
                    </div>
                    
                    <div class="calendar-weekdays">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                    </div>
                    
                    <div id="calendar-days" class="calendar-days"></div>
                </div>

                <input type="hidden" id="selected-date" name="selected-date">
                <p id="selected-date-display" class="selected-date-text" style="margin-top:10px; font-style:italic;">Aucune date sélectionnée</p>
            </div>

            <div id="event-preview" class="event-card">
                <h3 id="event-title"></h3>
                <img id="event-image" src="" alt="Affiche de l'événement" style="max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 10px;">
                <p id="event-description"></p>
                <a id="event-link" href="#" class="btn-auth" target="_blank" style="display:inline-block; margin-top:10px;">Voir la page de l'événement ➔</a>
            </div>

            <div class="form-group" style="margin-top:15px;">
                <label for="satisfaction">Comment évaluez-vous le site ?</label>
                <select id="satisfaction" required>
                    <option value="Très satisfait">Très bien</option>
                    <option value="Satisfait">Bien</option>
                    <option value="Neutre">À améliorer</option>
                    <option value="Insatisfait">Pas super</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Un commentaire ou une idée pour l'améliorer ?</label>
                <textarea id="survey-comment" rows="3" placeholder="Votre avis..."></textarea>
            </div>

            <button type="submit" class="btn-auth" style="background:#16a34a; padding:10px 20px; font-size:16px; margin-top:10px;">Envoyer mon inscription</button>
            <p id="form-message" style="margin-top: 15px; font-weight: bold;"></p>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
