<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Questionnaire satisfaction atelier papote</title>
	<link rel="stylesheet" href="./style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Slab:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="container">
	<h1>
		<img class="logo"  alt="Print it ! Impressions d'entreprises">
	</h1>
</header>

<main>

    <div class="container">
        <div class="top-bar">
            <div id="auth-status">
                <span>Bienvenue sur Atelier Papote !</span>
            </div>
            <div>
                <button id="btn-open-login" class="btn-auth">Se connecter</button>
                <a id="btn-admin-space" href="admin.html" class="btn-auth" style="display: none; background-color: #e11d48; text-decoration: none; margin-left: 5px;">Espace Admin 🛠️</a>
            </div>
        </div>
    </div>

	<div class="form-group container">
		<div class="calendar-header">
			<button type="button" class="carousel-arrow left-arrow" onclick="changeSlide(-1)">&lt;</button>
			<img id="banner-img" class="banner-img" src="./assets/images/slideshow/coraline.jpg" alt="Banner Print-it">
			<button type="button" class="carousel-arrow right-arrow" onclick="changeSlide(1)">&gt;</button>
			<div class="dots" id="dots"></div>
		</div>
		<div id="banner-txt" class="banner-txt">Questionnaire satisfaction <span>en ligne</span></div>
	</div>

	<section id="questionnaire-section" class="container">
		<div>
			<h2>Questionnaire et inscription</h2>
			
			<form id="workshop-form">
				<div class="form-group">
					<label for="name">Votre surnom :</label>
					<input type="text" id="name" name="name" required placeholder="Ex: Pommni">
				</div>

				<div class="form-group">
					<label for="email">Votre Adresse Email :</label>
					<input type="email" id="email" name="email" required placeholder="ex: jean@mail.com">
				</div>

				<div class="form-group">
					<label for="satisfaction">Comment évaluez-vous votre satisfaction ?</label>
					<select id="satisfaction" name="satisfaction" required>
						<option value="">-- Choisissez une option --</option>
						<option value="Très satisfait">Très satisfait</option>
						<option value="Satisfait">Satisfait</option>
						<option value="Moyen">Moyen</option>
						<option value="Déçu">Déçu</option>
					</select>
				</div>

				<div class="form-group">
					<label>Sélectionnez la date de l'atelier dans le calendrier :</label>

					<div class="calendar-container">
						<div class="calendar-header">
							<button type="button" id="prev-month">&lt;</button>
							<h3 id="calendar-month-year"></h3>
							<button type="button" id="next-month">&gt;</button>
						</div>

						<div class="calendar-weekdays">
							<div>Lun</div>
							<div>Mar</div>
							<div>Mer</div>
							<div>Jeu</div>
							<div>Ven</div>
							<div>Sam</div>
							<div>Dim</div>
						</div>

						<div class="calendar-days" id="calendar-days"></div>
						
						<p id="selected-date-display">Date choisie : <span>Aucune date sélectionnée</span></p>
						<input type="hidden" id="selected-date" name="eventDate" required>
					</div>

					<div id="event-preview" class="event-preview-card" style="display: none;">
						<h3 id="event-title"></h3>
						<img id="event-image" src="" alt="Affiche de l'événement" style="max-width: 200px; border-radius: 8px;">
						<p id="event-description"></p>
						<a id="event-link" href="#" class="btn-event-page">Voir le questionnaire & recettes ➔</a>
					</div>
				</div>

				<button type="submit" class="btn-submit">Envoyer mon inscription</button>
				<p id="form-message"></p>
			</form>
		</div>
	</section>
</main>

<script src="script.js"></script>
<script src="script.js?v=2"></script>

</body>
</html>
