<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Papote</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles de secours pour garantir un affichage propre */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background-color: #0f172a; color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .auth-buttons { display: flex; gap: 10px; }
        .btn-auth { background-color: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-auth:hover { background-color: #0369a1; }
        .btn-admin { background-color: #e11d48; }
        .btn-admin:hover { background-color: #be123c; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; color: #333; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 24px; font-weight: bold; color: #64748b; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; color: #64748b; }
        .tab-btn.active { border-bottom: 2px solid #0284c7; color: #0284c7; }

        .calendar-container { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 15px; max-width: 450px; margin: 15px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #64748b; margin-bottom: 8px; font-size: 14px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 14px; }
        .calendar-day.empty { background: transparent; border: none; }
        .calendar-day.event-day { background: #e0f2fe; border: 2px solid #0284c7; color: #0369a1; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .calendar-day.event-day:hover { transform: scale(1.05); }

        .dot { width: 12px; height: 12px; background-color: #cbd5e1; border-radius: 50%; display: inline-block; cursor: pointer; }
        .dot.active { background-color: #0284c7; width: 24px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div id="auth-status">
                <span>Bienvenue sur Atelier Papote !</span>
            </div>
            <div class="auth-buttons" id="auth-actions">
                <button id="btn-open-register" class="btn-auth">Connexion / Compte</button>
                <button id="btn-open-admin-login" class="btn-auth btn-admin">Connexion Admin 🛠️</button>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div style="display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:15px;">
                <button id="tab-login" class="tab-btn active">Se connecter</button>
                <button id="tab-register" class="tab-btn">Créer un compte</button>
            </div>

            <div id="form-login">
                <label style="display:block; margin-top:10px; font-weight:bold;">Pseudo :</label>
                <input type="text" id="login-username" placeholder="Votre pseudo" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Mot de passe :</label>
                <input type="password" id="login-password" placeholder="Votre mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <button id="btn-submit-login" class="btn-auth" style="width:100%; margin-top:18px; padding:10px;">Connexion</button>
            </div>

            <div id="form-register" style="display:none;">
                <label style="display:block; margin-top:10px; font-weight:bold;">Pseudo :</label>
                <input type="text" id="reg-username" placeholder="Ex: Alex" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Mot de passe :</label>
                <input type="password" id="reg-password" placeholder="Mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Avatar (Optionnel) :</label>
                <input type="text" id="reg-avatar" placeholder="https://..." style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <button id="btn-submit-register" class="btn-auth" style="width:100%; background:#16a34a; margin-top:18px; padding:10px;">S'inscrire</button>
            </div>
        </div>
    </div>

    <header class="container">
        <div id="banner" style="position: relative; text-align: center;">
            <img id="banner-img" src="assets/images/coraline.jpg" alt="Bannière Atelier Papote" style="width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 8px;">
            <p id="banner-txt" style="margin-top: 10px; font-weight: bold;"></p>
            <div id="dots" style="display: flex; justify-content: center; gap: 8px; margin-top: 10px;"></div>
        </div>
    </header>

    <main class="container">
        <h2>Questionnaire et inscription</h2>

        <form id="workshop-form">
            <div class="form-group">
                <label for="name">Votre surnom :</label>
                <input type="text" id="name" placeholder="Ex: Pommni" required>
            </div>

            <div class="form-group">
                <label style="font-weight:bold; display:block; margin-top:15px;">Sélectionnez la date de l'atelier dans le calendrier :</label>
                
                <div class="calendar-container">
                    <div class="calendar-header">
                        <span id="calendar-month-year" style="font-weight:bold; font-size:16px;">Août 2026</span>
                    </div>
                    
                    <div class="calendar-weekdays">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                    </div>
                    
                    <div id="calendar-grid" class="calendar-grid"></div>
                </div>

                <p id="selected-date-display" style="text-align:center; font-style:italic; color:#64748b; margin-top:8px;">Aucune date sélectionnée</p>
            </div>

            <div class="form-group">
                <label for="satisfaction">Comment évaluez-vous le site ?</label>
                <select id="satisfaction" required>
                    <option value="Très satisfait">Très bien</option>
                    <option value="Satisfait">Bien</option>
                    <option value="Neutre">À améliorer</option>
                    <option value="Insatisfait">Pas super</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Un commentaire ou une idée pour l'améliorer ?</label>
                <textarea id="survey-comment" rows="3" placeholder="Votre avis..."></textarea>
            </div>

            <button type="submit" class="btn-auth" style="background:#16a34a; font-size:16px; padding:12px; width:100%; border:none; margin-top:15px; border-radius:8px; cursor:pointer;">Envoyer mon inscription</button>
        </form>
    </main>

    <div id="chat-widget" style="position:fixed; bottom:20px; right:20px; z-index:9999;">
        <button id="btn-toggle-chat" class="btn-auth" style="border-radius:20px; padding:10px 20px;">💬 Chat Support / Admin</button>
        
        <div id="chat-box" style="display:none; position:absolute; bottom:50px; right:0; width:320px; height:400px; background:white; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.3); flex-direction:column; overflow:hidden;">
            <div style="background:#0284c7; color:white; padding:10px; font-weight:bold; display:flex; justify-content:space-between;">
                <span>Chat Support</span>
                <span id="close-chat" style="cursor:pointer;">&times;</span>
            </div>
            <div id="chat-messages" style="flex:1; padding:10px; overflow-y:auto; font-size:14px; background:#f8fafc;"></div>
            <div style="padding:10px; display:flex; gap:5px; border-top:1px solid #e2e8f0;">
                <input type="text" id="chat-input" placeholder="Message..." style="flex:1; padding:8px; border:1px solid #cbd5e1; border-radius:6px;">
                <button id="btn-send-chat" class="btn-auth">Envoyer</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
