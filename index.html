<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Papote</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS du Calendrier et de la mise en forme */
        .calendar-container {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            max-width: 450px;
            margin: 15px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .calendar-day {
            min-height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 14px;
        }
        .calendar-day.empty {
            background: transparent;
            border: none;
        }
        .calendar-day.event-day {
            background: #e0f2fe;
            border: 2px solid #0284c7;
            color: #0369a1;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .calendar-day.event-day:hover {
            transform: scale(1.05);
            background: #bae6fd;
        }

        /* Dots du carrousel */
        .dot {
            width: 12px;
            height: 12px;
            background-color: #cbd5e1;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {
            background-color: #0284c7;
            width: 24px;
            border-radius: 6px;
        }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; color: #333; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 24px; font-weight: bold; color: #64748b; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; color: #64748b; }
        .tab-btn.active { border-bottom: 2px solid #0284c7; color: #0284c7; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div id="auth-status">
                <span>Bienvenue sur Atelier Papote !</span>
            </div>
            <div class="auth-buttons" id="auth-actions">
                <button id="btn-open-register" class="btn-auth">Créer un compte / Connexion</button>
                <button id="btn-open-admin-login" class="btn-auth btn-admin">Connexion Admin 🛠️</button>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            
            <div style="display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:15px;">
                <button id="tab-login" class="tab-btn active">Se connecter</button>
                <button id="tab-register" class="tab-btn">Créer un compte</button>
            </div>

            <div id="form-login">
                <label style="display:block; margin-top:10px; font-weight:bold;">Pseudo :</label>
                <input type="text" id="login-username" placeholder="Votre pseudo" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Mot de passe :</label>
                <input type="password" id="login-password" placeholder="Votre mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <button id="btn-submit-login" class="btn-auth" style="width:100%; margin-top:18px; padding:10px;">Connexion</button>
            </div>

            <div id="form-register" style="display:none;">
                <label style="display:block; margin-top:10px; font-weight:bold;">Choisissez un pseudo :</label>
                <input type="text" id="reg-username" placeholder="Ex: Alex" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Choisissez un mot de passe :</label>
                <input type="password" id="reg-password" placeholder="Mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Avatar / Photo (Optionnel) :</label>
                <input type="text" id="reg-avatar" placeholder="https://..." style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <button id="btn-submit-register" class="btn-auth" style="width:100%; background:#16a34a; margin-top:18px; padding:10px;">Créer mon compte</button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 style="color: #e11d48; margin-top:0;">Connexion Administrateur</h3>
            
            <div class="form-group">
                <label for="admin-pass" style="font-weight:bold;">Mot de passe Admin :</label>
                <input type="password" id="admin-pass" placeholder="Entrez le mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
            </div>

            <button id="btn-submit-admin" class="btn-auth btn-admin" style="width: 100%; margin-top: 15px; padding:10px;">Se connecter</button>
        </div>
    </div>

    <header class="container">
        <div id="banner" style="position: relative; text-align: center;">
            <img id="banner-img" src="assets/images/coraline.jpg" alt="Bannière Atelier Papote" style="width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 8px;">
            <p id="banner-txt" style="margin-top: 10px; font-weight: bold; color:#0f172a;"></p>
            
            <div id="dots" style="display: flex; justify-content: center; align-items:center; gap: 8px; margin-top: 10px;"></div>
        </div>
    </header>

    <main class="container">
        <h2 style="text-align:center;">Questionnaire et inscription</h2>

        <form id="workshop-form">
            <div class="form-group">
                <label for="name">Votre surnom :</label>
                <input type="text" id="name" placeholder="Ex: Pommni" required>
            </div>

            <div class="form-group">
                <label style="font-weight:bold; display:block; text-align:center; margin-top:15px;">Sélectionnez la date de l'atelier :</label>
                
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button type="button" id="prev-month" style="background:none; border:none; cursor:pointer; font-weight:bold; font-size:18px;">&lt;</button>
                        <span id="calendar-month-year" style="font-weight:bold; font-size:16px;">Août 2026</span>
                        <button type="button" id="next-month" style="background:none; border:none; cursor:pointer; font-weight:bold; font-size:18px;">&gt;</button>
                    </div>
                    
                    <div class="calendar-weekdays">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                    </div>
                    
                    <div id="calendar-grid" class="calendar-grid"></div>
                </div>

                <input type="hidden" id="selected-date" name="selected-date">
                <p id="selected-date-display" style="text-align:center; font-style:italic; color:#64748b; margin-top:8px;">Aucune date sélectionnée</p>
            </div>

            <div class="form-group">
                <label for="satisfaction">Comment évaluez-vous le site ?</label>
                <select id="satisfaction" required>
                    <option value="Très satisfait">Très bien</option>
                    <option value="Satisfait">Bien</option>
                    <option value="Neutre">À améliorer</option>
                    <option value="Insatisfait">Pas super</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Un commentaire ou une idée pour l'améliorer ?</label>
                <textarea id="survey-comment" rows="3" placeholder="Votre avis..."></textarea>
            </div>

            <button type="submit" class="btn-auth" style="background:#16a34a; font-size:16px; padding:12px; width:100%; border:none; margin-top:15px; border-radius:8px; cursor:pointer;">Envoyer mon inscription</button>
            <p id="form-message" style="margin-top: 15px; font-weight: bold; text-align:center;"></p>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
