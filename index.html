<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Papote</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles pour la barre de connexion & profil */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0284c7;
        }
        .btn-auth {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-auth:hover { background-color: #0369a1; }
        
        /* Modal / Pop-up de connexion */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            color: #333;
        }
        .modal-content h3 { margin-top: 0; color: #0f172a; }
        .close-modal {
            float: right;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div id="auth-status">
                <span>Bienvenue sur Atelier Papote !</span>
            </div>
            <div>
                <button id="btn-open-login" class="btn-auth">Se connecter</button>
                <a id="btn-admin-space" href="admin.html" class="btn-auth" style="display: none; background-color: #e11d48; text-decoration: none; margin-left: 5px;">Espace Admin 🛠️</a>
            </div>
        </div>
    </div>

    <header class="container">
        <div id="banner">
            <img id="banner-img" src="./assets/images/slideshow/coraline.jpg" alt="Bannière Atelier Papote">
            <p id="banner-txt">Questionnaire satisfaction <span>en ligne</span></p>
            <div id="dots"></div>
        </div>
    </header>

    <main class="container">
        <h2>Questionnaire et inscription</h2>

        <form id="workshop-form">
            <div class="form-group">
                <label for="name">Votre surnom :</label>
                <input type="text" id="name" placeholder="Ex: Pommni" required>
            </div>

            <div class="form-group">
                <label for="email">Votre Adresse Email :</label>
                <input type="email" id="email" placeholder="ex.jean@mail.com" required>
            </div>

            <div class="form-group">
                <label for="satisfaction">Comment évaluez-vous votre satisfaction ?</label>
                <select id="satisfaction" required>
                    <option value="Très satisfait">Très satisfait</option>
                    <option value="Satisfait">Satisfait</option>
                    <option value="Neutre">Neutre</option>
                    <option value="Insatisfait">Insatisfait</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sélectionnez la date de l'atelier dans le calendrier :</label>
                
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button type="button" id="prev-month">&lt;</button>
                        <span id="calendar-month-year">Août 2026</span>
                        <button type="button" id="next-month">&gt;</button>
                    </div>
                    
                    <div class="calendar-weekdays">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                    </div>
                    
                    <div id="calendar-days" class="calendar-days"></div>
                </div>

                <input type="hidden" id="selected-date" name="selected-date">
                <p id="selected-date-display" class="selected-date-text">Aucune date sélectionnée</p>
            </div>

            <div id="event-preview" style="display: none;" class="event-card">
                <h3 id="event-title"></h3>
                <img id="event-image" src="" alt="Affiche de l'événement" style="max-width: 100%; height: auto; border-radius: 8px;">
                <p id="event-description"></p>
                <a id="event-link" href="#" class="btn-event-page" target="_blank">Voir le questionnaire & recettes ➔</a>
            </div>

            <button type="submit" class="btn-submit">Envoyer mon inscription</button>
            <p id="form-message" style="margin-top: 15px; font-weight: bold;"></p>
        </form>
    </main>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h3>Connexion</h3>
            
            <div class="form-group">
                <label for="login-username">Pseudo :</label>
                <input type="text" id="login-username" placeholder="Entrez votre pseudo (ou 'admin')">
            </div>

            <div id="avatar-group" class="form-group">
                <label for="login-avatar">Lien d'image Avatar (URL) :</label>
                <input type="text" id="login-avatar" placeholder="https://.../mon-avatar.jpg">
            </div>

            <div id="password-group" class="form-group" style="display: none;">
                <label for="login-password">Mot de passe Administrateur :</label>
                <input type="password" id="login-password" placeholder="Mot de passe admin">
            </div>

            <button id="btn-submit-login" class="btn-submit" style="width: 100%; margin-top: 10px;">Valider</button>
        </div>
    </div>

    <script src="script.js?v=4"></script>
</body>
</html>
