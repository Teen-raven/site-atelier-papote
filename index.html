<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Papote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div id="auth-status">
                <span>Bienvenue sur Atelier Papote !</span>
            </div>
            <div class="auth-buttons" id="auth-actions">
                <button id="btn-open-register" class="btn-auth">Créer un compte / Connexion</button>
                <button id="btn-open-admin-login" class="btn-auth btn-admin">Connexion Admin 🛠️</button>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div style="display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:15px;">
                <button id="tab-login" class="tab-btn active">Se connecter</button>
                <button id="tab-register" class="tab-btn">Créer un compte</button>
            </div>

            <div id="form-login">
                <label style="display:block; margin-top:10px; font-weight:bold;">Pseudo :</label>
                <input type="text" id="login-username" placeholder="Votre pseudo" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Mot de passe :</label>
                <input type="password" id="login-password" placeholder="Votre mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <button id="btn-submit-login" class="btn-auth" style="width:100%; margin-top:18px; padding:10px;">Connexion</button>
            </div>

            <div id="form-register" style="display:none;">
                <label style="display:block; margin-top:10px; font-weight:bold;">Choisissez un pseudo :</label>
                <input type="text" id="reg-username" placeholder="Ex: Alex" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Choisissez un mot de passe :</label>
                <input type="password" id="reg-password" placeholder="Mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <label style="display:block; margin-top:10px; font-weight:bold;">Avatar / Photo (Optionnel) :</label>
                <input type="text" id="reg-avatar" placeholder="https://..." style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

                <button id="btn-submit-register" class="btn-auth" style="width:100%; background:#16a34a; margin-top:18px; padding:10px;">Créer mon compte</button>
            </div>
        </div>
    </div>

    <div id="suggestions-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 style="margin-top:0; color:#0284c7;">💡 Proposer une suggestion / idée</h3>
            <textarea id="profile-suggestion-text" rows="4" placeholder="Votre idée ou suggestion..." style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;"></textarea>
            <button id="btn-submit-suggestion" class="btn-auth" style="width:100%; margin-top:15px; background:#16a34a;">Envoyer la suggestion</button>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 style="color: #e11d48; margin-top:0;">Connexion Administrateur</h3>
            
            <div class="form-group">
                <label for="admin-pass" style="font-weight:bold;">Mot de passe Admin :</label>
                <input type="password" id="admin-pass" placeholder="Entrez le mot de passe" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
            </div>

            <button id="btn-submit-admin" class="btn-auth btn-admin" style="width: 100%; margin-top: 15px; padding:10px;">Se connecter</button>
        </div>
    </div>

    <header class="container">
        <div id="banner" style="position: relative; text-align: center;">
            <img id="banner-img" src="assets/images/coraline.jpg" alt="Bannière Atelier Papote" style="width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 8px;">
            <p id="banner-txt" style="margin-top: 10px; font-weight: bold; color:#0f172a;"></p>
            <div id="dots" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px;"></div>
        </div>
    </header>

    <main class="container">
        <h2 style="text-align:left; margin-top:25px;">Questionnaire et inscription</h2>

        <form id="workshop-form">
            <div class="form-group">
                <label for="name" style="font-weight:bold;">Votre surnom :</label>
                <input type="text" id="name" placeholder="Ex: Pommni" required style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
            </div>

            <div class="form-group">
                <label style="font-weight:bold; display:block; margin-top:15px;">Sélectionnez la date de l'atelier dans le calendrier :</label>
                
                <div class="calendar-container" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; padding:15px; margin-top:10px;">
                    <div class="calendar-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button type="button" id="prev-month" style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:4px 12px; cursor:pointer;">&lt;</button>
                        <span id="calendar-month-year" style="font-weight:bold;">Août 2026</span>
                        <button type="button" id="next-month" style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:4px 12px; cursor:pointer;">&gt;</button>
                    </div>
                    
                    <div class="calendar-weekdays" style="display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; font-weight:bold; color:#64748b; font-size:13px; margin-bottom:8px;">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                    </div>
                    
                    <div id="calendar-days" class="calendar-days" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;"></div>
                </div>

                <input type="hidden" id="selected-date" name="selected-date">
                <p id="selected-date-display" style="font-style:italic; color:#64748b; margin-top:10px;">Aucune date sélectionnée</p>
            </div>

            <div id="event-preview" style="display:none; margin-top:15px; padding:15px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc;">
                <h3 id="event-title" style="margin-top:0; color:#0284c7;"></h3>
                <img id="event-image" src="" alt="Affiche" style="max-width:100%; height:auto; border-radius:6px; margin-bottom:10px;">
                <p id="event-description" style="color:#334155; font-size:14px;"></p>
                <a id="event-link" href="#" target="_blank" class="btn-auth" style="display:inline-block; margin-top:10px; text-decoration:none;">Voir la page de l'événement ➔</a>
            </div>

            <div class="form-group" style="margin-top:15px;">
                <label for="satisfaction" style="font-weight:bold;">Comment évaluez-vous le site ?</label>
                <select id="satisfaction" required style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                    <option value="Très satisfait">Très bien</option>
                    <option value="Satisfait">Bien</option>
                    <option value="Neutre">À améliorer</option>
                    <option value="Insatisfait">Pas super</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-top:15px;">
                <label style="font-weight:bold;">Un commentaire ou une idée pour l'améliorer ?</label>
                <textarea id="survey-comment" rows="3" placeholder="Votre avis..." style="width:100%; padding:10px; margin-top:5px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;"></textarea>
            </div>

            <button type="submit" class="btn-auth" style="background:#16a34a; font-size:16px; padding:12px 20px; border:none; margin-top:15px; border-radius:6px; cursor:pointer;">Envoyer mon inscription</button>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
