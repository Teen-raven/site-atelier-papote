h2{font-size:14px;margin:0 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
h3{font-size:12px;margin:12px 0 4px;color:var(--ac);text-transform:uppercase;letter-spacing:.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}
.rank{width:64px;height:64px;border-radius:12px;border:2px solid var(--ac);display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--ac)}

.bar>i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{font-size:20px;color:var(--ac)}.stat:last-child:nth-child(odd){grid-column:span 2}

.q.done{border-color:var(--ok)}.q.done .bar>i{background:var(--ok)}
button{background:var(--ac);color:var(--bt);border:0;border-radius:8px;padding:9px 12px;font-size:15px;font-weight:600;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:none;border:1px solid var(--line);color:var(--tx);padding:7px 10px}
.chip.on{border-color:var(--ac);background:var(--ac);color:var(--bt)}

.msg{text-align:center;font-size:14px;min-height:20px;color:var(--ok)}.msg.w{color:var(--wa)}
#bt{width:100%;display:block;border-radius:10px;background:rgba(0,0,0,.28);margin-bottom:8px}
.fc{border:2px solid var(--line);border-radius:16px;padding:22px;text-align:center;background:var(--bg);touch-action:pan-y;user-select:none;cursor:grab}
.ring{width:140px;height:140px;border-radius:50%;margin:10px auto;display:grid;place-items:center}.ring>div{width:112px;height:112px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:44px;font-weight:800}
button:disabled{opacity:.45;cursor:default}

:root{--gold:#d9b25f}

h2{color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.6);text-align:center}
.row h2{text-align:left}
button{background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 62%,#000));border:1px solid rgba(255,255,255,.4);box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45)}
button.g,.chip{background:none;box-shadow:none}
.chip.on{background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 62%,#000))}
.av{overflow:hidden;border:2px solid var(--gold);padding:0}
#bt{border:2px solid var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.55)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc{border:2px solid var(--rc);border-radius:12px;padding:8px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.22));box-shadow:0 0 12px color-mix(in srgb,var(--rc) 35%,transparent)}
.pt{width:64px;height:80px;border-radius:8px;border:2px solid var(--rc);display:block;margin:0 auto 6px}
.hn{font-weight:700;font-size:14px}.stars{color:#ffcf5a;letter-spacing:1px;font-size:14px}.lv{color:var(--mu);font-size:12px;letter-spacing:0}
</style>
</head>
