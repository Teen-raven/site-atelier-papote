<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Administration</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
        .admin-card { background: white; max-width: 500px; margin: 40px auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-back { display: inline-block; margin-bottom: 15px; color: #0284c7; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-card">
        <a href="index.html" class="btn-back">← Retour au site</a>
        <h2>Espace Administration 🛠️</h2>

        <div id="admin-content">
            <p><strong>Bienvenue sur votre espace d'administration !</strong></p>
            <p>Connecté en tant que responsable du site.</p>
        </div>
    </div>

    <script>
        // Vérification d'accès Admin
        const session = JSON.parse(localStorage.getItem('user_session'));
        if (!session || !session.isAdmin) {
            alert("Accès réservé aux administrateurs !");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
