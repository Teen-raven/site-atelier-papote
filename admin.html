<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Administration</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .btn { background: #0284c7; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }
        .btn-danger { background: #ef4444; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 30px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; }
        th { background: #0f172a; color: #38bdf8; }
        .avatar-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; }
        .badge { background: #0284c7; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .password-tag { background: #334155; color: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🛠️ Tableau de bord Administrateur</h2>
            <a href="index.html" class="btn">← Retour au site</a>
        </div>

        <h3>👥 Utilisateurs inscrits</h3>
        <table>
            <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Pseudo</th>
                    <th>Mot de passe 🔑</th>
                    <th>Inscription</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
        </table>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📋 Inscriptions & Réponses reçues</h3>
            <button id="btn-clear-submissions" class="btn btn-danger btn-sm">Effacer les réponses</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Date d'envoi</th>
                    <th>Pseudo</th>
                    <th>Satisfaction</th>
                    <th>Date Atelier</th>
                </tr>
            </thead>
            <tbody id="submissions-table-body"></tbody>
        </table>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('user_session'));
        if (!session || !session.isAdmin) {
            alert("Accès réservé à l'administrateur !");
            window.location.href = "index.html";
        }

        function loadUsers() {
            const tbody = document.getElementById('users-table-body');
            const users = JSON.parse(localStorage.getItem('registered_users')) || [];

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Aucun utilisateur inscrit.</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td><img src="${user.avatar}" class="avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=User'"></td>
                    <td><strong>${user.username}</strong></td>
                    <td><span class="password-tag">${user.password}</span></td>
                    <td><small>${user.createdAt || 'N/A'}</small></td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">❌ Supprimer</button></td>
                </tr>
            `).join('');
        }

        function deleteUser(userId) {
            if (confirm("Supprimer cet utilisateur ?")) {
                let users = JSON.parse(localStorage.getItem('registered_users')) || [];
                users = users.filter(u => u.id !== userId);
                localStorage.setItem('registered_users', JSON.stringify(users));
                loadUsers();
            }
        }

        function loadSubmissions() {
            const tbody = document.getElementById('submissions-table-body');
            const submissions = JSON.parse(localStorage.getItem('form_submissions')) || [];

            if (submissions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Aucune réponse reçue.</td></tr>`;
                return;
            }

            tbody.innerHTML = submissions.map(sub => `
                <tr>
                    <td><small>${sub.submittedAt}</small></td>
                    <td><strong>${sub.name}</strong></td>
                    <td><span class="badge">${sub.satisfaction}</span></td>
                    <td>${sub.eventDate}</td>
                </tr>
            `).join('');
        }

        document.getElementById('btn-clear-submissions')?.addEventListener('click', () => {
            if (confirm("Effacer toutes les réponses ?")) {
                localStorage.removeItem('form_submissions');
                loadSubmissions();
            }
        });

        loadUsers();
        loadSubmissions();
    </script>
</body>
</html>
